# Recording-station environment for xr_teleoperate (headset-only, --no-robot).
#
# Reproduces the `xr_station` env verified working on `modinoid` 2026-09-05..08.
#
#   conda env create -f environment.yml
#   conda activate xr_station
#   ./setup_station.sh            # MUST run this too -- see below
#
# WHY environment.yml IS NOT ENOUGH ON ITS OWN
# --------------------------------------------
# Three things cannot be expressed here and are handled by setup_station.sh:
#
#  1. `pinocchio` MUST come from conda-forge, not pip. The PyPI `pin` wheels contain NO
#     casadi bindings at all (checked 2.7.0 and 4.1.0), and teleop/robot_control/
#     robot_arm_ik.py is built entirely on `import pinocchio.casadi`. This is why the whole
#     env is conda rather than a venv. It is pinned below.
#  2. `torch==2.3.0` must come from the PyTorch CPU index. dex-retargeting's optimizer
#     genuinely uses torch (SmoothL1Loss + autograd) but only on tiny tensors, so the CPU
#     build is correct and saves ~2 GB over a CUDA one.
#  3. televuer / teleimager / dex-retargeting are vendored submodules and must be installed
#     editable FROM THIS REPO. dex-retargeting in particular must be installed with
#     --no-deps, because it declares `pin>=2.7.0` and letting pip satisfy that installs the
#     PyPI `pin` wheel OVER conda's pinocchio, silently destroying the casadi bindings.
#
# Pins worth knowing: `params-proto==2.13.2` -- vuer 0.0.60 imports `Flag`, which
# params-proto 3.x removed, and vuer reports the failure as a misleading
# "install vuer[all]" message. `pupil-labs-uvc` ships only cp310 wheels, which is one
# reason python is pinned to 3.10.
#
# Full context, including the camera prerequisites (udev rules, USB3, teleimager certs):
# ../STATION_SETUP.md

name: xr_station
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pinocchio=3.1.0
  - numpy=1.26.4
  - pip
